[project]
name = "machines-secrets-vm"
revision = "1.0"
require_reason = false

[providers]
local = "dotenv://.env"

[profiles.default]
APP_TOKEN = { description = "Token delivered to the test machine", required = true }
AGE_KEY = { description = "Key delivered to a custom path", required = true }
