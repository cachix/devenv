[package]
name = "devenv-tasks"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
devenv-activity.workspace = true
devenv-cache-core.workspace = true
devenv-core.workspace = true
devenv-mailbox.workspace = true
devenv-processes.workspace = true

async-trait.workspace = true
clap.workspace = true
console.workspace = true
miette.workspace = true
petgraph.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-shutdown.workspace = true
tokio-util.workspace = true
tracing.workspace = true
sqlx.workspace = true
shell-escape.workspace = true
base64.workspace = true
ignore.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["user", "signal"] }

[features]
default = []
# Fault-injection hooks for the integration tests in `tests/`.
test-all = ["devenv-processes/test-all"]

[dev-dependencies]
pretty_assertions.workspace = true
proptest.workspace = true
tokio-test.workspace = true
nix = { workspace = true, features = ["signal"] }
