name: "TUI fuzz"

# End-to-end fuzzing of the real TUI binary through a PTY using bombadil
# (experimental, pinned). This complements the deterministic property tests in
# devenv-tui/tests/tui_proptest.rs, which already run on every PR via the
# `cargo nextest run --features devenv/test-all` step in build.yml.
#
# Runs nightly (and on demand) rather than per-PR: it is slow and the trace it
# records grows fast. On a property violation it stops early and uploads the
# reproducer so it can be replayed with `bombadil terminal test --reproduce`.

on:
  schedule:
    - cron: "0 3 * * *" # nightly, 03:00 UTC
  workflow_dispatch:
    inputs:
      time-limit:
        description: "bombadil --time-limit (e.g. 120s, 5m, 1h)"
        required: false
        default: "120s"

concurrency:
  group: tui-fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Post-v0.6.1: includes configurable PTY quiescence and generated action
  # templates. Pin until those terminal changes are included in a release.
  BOMBADIL_REV: ddf7942fa502ca65b9f7b2d605fedf649b2528c2

jobs:
  fuzz:
    name: bombadil terminal fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: devenv
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build devenv
        id: build-devenv
        run: |
          devenv_path=$(nix build -L --print-out-paths --system x86_64-linux .#devenv)
          echo "path=$devenv_path" >> "$GITHUB_OUTPUT"

      - name: Build tui-replay (deterministic)
        id: build-tui-replay
        run: |
          # Ask cargo for the absolute path of the binary it built, rather than
          # guessing at the layout under target/. bombadil spawns the target in
          # its own working directory, so a relative path would not resolve.
          bin=$("${{ steps.build-devenv.outputs.path }}/bin/devenv" shell -- \
            cargo build -p devenv-tui --features deterministic-tui --bin tui-replay \
              --message-format=json -q \
            | jq -rR 'fromjson? | select(.reason == "compiler-artifact" and .target.name == "tui-replay") | .executable // empty' \
            | tail -1)
          echo "Built tui-replay at $bin"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      - name: Build deterministic PTY driver
        id: build-pty-driver
        run: |
          bin=$("${{ steps.build-devenv.outputs.path }}/bin/devenv" shell -- \
            cargo build -p devenv-run-tests --bin devenv-run-tests \
              --message-format=json -q \
            | jq -rR 'fromjson? | select(.reason == "compiler-artifact" and .target.name == "devenv-run-tests") | .executable // empty' \
            | tail -1)
          echo "Built PTY driver at $bin"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      # Run the stable regression first. A failure here is actionable without
      # interpreting a random trace and protects the target Bombadil relies on.
      - name: Run deterministic replay corpus
        run: |
          bash devenv-tui/tests/replay-pty.sh \
            "${{ steps.build-pty-driver.outputs.bin }}" \
            "${{ steps.build-tui-replay.outputs.bin }}"

      - name: Build pinned bombadil
        id: build-bombadil
        run: |
          path=$(nix build --accept-flake-config --no-link --print-out-paths \
            "github:antithesishq/bombadil/${BOMBADIL_REV}#default")
          echo "Built bombadil ${BOMBADIL_REV} at $path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          "$path/bin/bombadil" --version

      - name: Run terminal fuzz
        run: |
          fixture="$PWD/devenv-tui/replays/processes.jsonl"
          event_log="$PWD/bombadil-events.jsonl"
          set +e
          "${{ steps.build-bombadil.outputs.path }}/bin/bombadil" terminal test \
            --time-limit "${{ github.event.inputs.time-limit || '120s' }}" \
            --exit-on-violation \
            --quiescence-timeout-ms 50 \
            --scrollback-lines-max 100 \
            --specification devenv-tui/bombadil/devenv-tui.spec.ts \
            --output-path bombadil-out \
            -- "${{ steps.build-tui-replay.outputs.bin }}" \
              --hold --attached --reactive --event-log "$event_log" "$fixture" \
            > bombadil.log 2>&1
          status=$?
          set -e
          tail -n 200 bombadil.log
          exit "$status"

      - name: Compress reproducer
        if: failure()
        run: |
          if [ -d bombadil-out ]; then
            tar -C bombadil-out -cf - . | zstd -19 -T0 -o bombadil-reproducer.tar.zst || true
          fi

      - name: Upload reproducer
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bombadil-reproducer
          path: |
            bombadil-reproducer.tar.zst
            bombadil.log
            bombadil-events.jsonl
          if-no-files-found: ignore
          retention-days: 14
