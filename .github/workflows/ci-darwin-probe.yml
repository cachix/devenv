name: Darwin process fixture with occupied ports

on:
  push:
    branches:
      - probe/ci-darwin-20261125

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVENV_CI_BINARY: /nix/store/1yjrzh09rbj4nad0yinkgixn8fp4k3cm-devenv-wrapped-2.4.1
      NIXPKGS_INPUT: github:cachix/devenv-nixpkgs/958ba64a6f8820ccb96a433a2e28bfd5f5e91fd7
      DEVENV_NO_AI_AGENT: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            extra-substituters = https://devenv.cachix.org https://cachix.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=
            accept-flake-config = true

      - name: Install the binary from the original PR
        id: binary
        run: |
          sw_vers
          uname -m
          nix-store --realise "$DEVENV_CI_BINARY"
          echo "$DEVENV_CI_BINARY/bin" >> "$GITHUB_PATH"

      - name: Verify process dependency attach and stop with the old ports occupied
        run: |
          python3 -u - <<'PY'
          import os
          from contextlib import ExitStack
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from subprocess import run
          from threading import Thread

          class Listener(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.end_headers()

          with ExitStack() as stack:
              for port in (18581, 18582, 18583):
                  server = ThreadingHTTPServer(("127.0.0.1", port), Listener)
                  Thread(target=server.serve_forever, daemon=True).start()
                  stack.callback(server.server_close)
                  stack.callback(server.shutdown)
                  print(f"Simulating a stale HTTP listener on {port}")
              run([
                  "devenv-run-tests", "run", "tests", "--only", "process-up-attach-deps",
                  "--override-input", "nixpkgs", os.environ["NIXPKGS_INPUT"],
              ], check=True, timeout=600)
          PY
