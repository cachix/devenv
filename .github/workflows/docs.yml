name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "functions/api/github.js"
      - "build_cloudflare.sh"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "functions/api/github.js"
      - "build_cloudflare.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run validate:urls
      - run: npm run validate:links
