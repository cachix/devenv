name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "functions/**/*.js"
      - "build_cloudflare.sh"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "functions/**/*.js"
      - "build_cloudflare.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run validate:urls
      - name: Check links
        uses: cachix/site-kit/check-links@1e9bb1e181430d4a8d632bc8c1487e16de946091
        with:
          working-directory: docs
          site: https://devenv.sh
