name: SecretSpec macOS storage probe

on:
  push:
    branches: [probe/macos-secret-files-3247]
    paths:
      - devenv/tests/macos_secret_files_probe.py
      - .github/workflows/secretspec-macos-probe.yml

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Probe RAM-disk ownership and lifecycle without sudo
        run: python3 -u devenv/tests/macos_secret_files_probe.py
